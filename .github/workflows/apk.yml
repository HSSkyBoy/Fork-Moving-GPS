name: Build APK

env:
    # main_project_module: app
    # target_owner: Xposed-Modules-Repo
    # target_repo: io.github.hsskyboy.forkmovinggps
    # target_path: target_path
  main_project_module: app
  apk_path_full: app/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk

on:
  push:
    branches:
      - "full"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Manual Version Override"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 設置 Java 環境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 給予 Gradlew 執行權限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 建立缺失的屬性檔案
      - name: Create missing properties files
        run: |
          touch secrets.defaults.properties
          touch local.properties

      - name: Hotfix source code errors
        run: |
          sed -i 's/^\s*\*\/\s*$//g' app/build.gradle

      - name: Build with Gradle
        run: ./gradlew assembleFullRelease --stacktrace

      # 上傳構建產物
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: ${{ env.apk_path_full }}
          retention-days: 30

      # ------------------------------------------------------------------
      # 以下步驟僅在 "打 Tag" (v*) 時執行，避免每次 Push 都發布 Release
      # ------------------------------------------------------------------

      - name: Determine Release Version
        if: startsWith(github.ref, 'refs/tags/')
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # 發布到 GitHub Releases (修改這裡：只發布 Full APK)
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ env.apk_path_full }}
          name: ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false

      - name: Sync to Xposed Repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          target_owner: Xposed-Modules-Repo
          target_repo: io.github.hsskyboy.forkmovinggps
          target_path: target_path
        run: |
          # 這裡需要 checkout 目標倉庫
          git clone https://${{ secrets.PAT }}@github.com/${{ env.target_owner }}/${{ env.target_repo }}.git ${{ env.target_path }}
          
          cd ${{ env.target_path }}
          # 複製當前倉庫的 README 和 LICENSE 過去
          cp ../README.md ../LICENSE .
          
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add README.md LICENSE
          
          # 只有當有變更時才提交，避免報錯
          if ! git diff-index --quiet HEAD; then
            git commit -m "Sync README/LICENSE from source for version ${{ steps.get_version.outputs.VERSION }}"
            git push
          else
            echo "No changes to commit"
          fi